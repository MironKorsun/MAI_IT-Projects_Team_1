# Развёртывание ВП ТС ЕГЭ: PostgreSQL 16 (ТЗ СЧ, приложение Б.2), API и Клиентская часть, Nginx с TLS.
# Перед первым запуском: cp .env.example .env (заполнить) и ./deploy/init-secrets.sh
name: ege

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ege}
      POSTGRES_USER: ${POSTGRES_USER:-ege}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ANALYST_DB_PASSWORD_FILE: /run/secrets/analyst_db_password
    secrets: [postgres_password, analyst_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    build: .
    image: ege-platform:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      KIM_MASTER_KEY_FILE: /run/secrets/kim_master_key
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Администратор системы}
    secrets: [database_url, kim_master_key, admin_password]
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/ege.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/secrets/tls:/etc/nginx/tls:ro
    networks: [frontend]

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
  analyst_db_password:
    file: ./deploy/secrets/analyst_db_password
  database_url:
    file: ./deploy/secrets/database_url
  kim_master_key:
    file: ./deploy/secrets/kim_master_key
  admin_password:
    file: ./deploy/secrets/admin_password

volumes:
  pgdata:

networks:
  backend:
  frontend: