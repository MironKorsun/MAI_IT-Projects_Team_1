# Nginx стенда (docker-compose): TLS, перенаправление HTTP→HTTPS, проксирование API, WebSocket и статики
# на узел приложения. Заголовки безопасности (CSP и др.) выставляет приложение на каждом ответе
# (ТЗ КЧ NFR-16), поэтому здесь они не дублируются и не теряются при наследовании add_header.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Импорт КИМ — до 50 МБ, файл распределения — до 10 МБ (ТЗ СЧ NFR-26)
  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  location ~ ^/api/v1/auth/.+/login$ {
    limit_req zone=login burst=20 nodelay;
    proxy_pass http://app:8080;
  }
  location /api/ { proxy_pass http://app:8080; proxy_read_timeout 10s; }
  location /ws/ {
    proxy_pass http://app:8080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
  }
  location / { proxy_pass http://app:8080; }
}
