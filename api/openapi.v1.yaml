    post:
      tags: [Попытки]
      summary: "Подтверждение готовности, фиксация T0 (FR-13)"
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Успешно }
        default: { $ref: '#/components/responses/Problem' }
  /attempts/{id}/answers/{taskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: taskId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Попытки]
      summary: "Сохранение ответа: seq, If-Match, окно приёма (FR-14–FR-17)"
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerPut' }
      responses:
        '200': { description: Успешно }
        default: { $ref: '#/components/responses/Problem' }
  /attempts/{id}/notes/{taskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
