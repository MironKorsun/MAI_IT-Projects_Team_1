    get:
      tags: [Попытки]
      summary: "Состояние попытки, serverTime, ответы с версиями (FR-10)"
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Успешно }
        default: { $ref: '#/components/responses/Problem' }
  /rooms/{id}/kim-package:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [КИМ]
      summary: "Зашифрованный пакет вариантов аудитории, Range (FR-30)"
      security: [{ workstationSecret: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Успешно }
        default: { $ref: '#/components/responses/Problem' }
