components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT (EdDSA, 15 мин) }
    workstationSecret: { type: apiKey, in: header, name: X-Workstation-Secret }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string, example: '"v4"' } }
    RequestId: { name: X-Request-Id, in: header, required: false, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED, INVALID_CREDENTIALS, TOKEN_INVALID, FORBIDDEN, AUTH_LOCKED, KIM_NOT_AVAILABLE, NOT_FOUND, INVALID_STATE, ATTEMPT_CLOSED, ROOM_ALREADY_STARTED, RESULTS_NOT_APPROVED, APPEAL_WINDOW_CLOSED, VERSION_MISMATCH, ROLE_CONFLICT, COMPENSATION_EXCEEDS_DOWNTIME, IDEMPOTENCY_KEY_REUSED, IMPORT_INVALID, RATE_LIMITED, OVERLOADED, INTERNAL_ERROR]
        requestId: { type: string }
        errors:
          type: array
          items: { type: object, properties: { pointer: { type: string }, detail: { type: string } } }
    ParticipantLogin:
      type: object
      additionalProperties: false
      required: [participantCode, accessCode, workstationSecret]
      properties:
        participantCode: { type: string, maxLength: 32 }
        accessCode: { type: string, pattern: '^\\d{6}$' }
        workstationSecret: { type: string }
    StaffLogin:
      type: object
      additionalProperties: false
      required: [login, password]
      properties: { login: { type: string }, password: { type: string, minLength: 12 } }
    AnswerPut:
      type: object
      additionalProperties: false
      required: [kind, value, seq, changedAtServerClock]
      properties:
        kind: { type: string, enum: [short] }
        value: { type: string, maxLength: 50 }
        seq: { type: integer, minimum: 1, description: Монотонный номер изменения в пределах попытки }
        changedAtServerClock: { type: string, format: date-time }
        final: { type: boolean }
    AppealPost:
      type: object
      additionalProperties: false
      required: [sessionId, taskNumbers, text]
      properties:
        sessionId: { type: string }
        taskNumbers: { type: array, items: { type: integer } }
        text: { type: string, minLength: 10, maxLength: 2000 }
